name: Terraform Security Validation

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:

  # ============================================================
  # 1. PRE-COMMIT
  # ============================================================
  pre-commit:
    name: Pre-commit Checks
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Install TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: Install pre-commit
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit

      - name: Run pre-commit
        run: |
          pre-commit run --all-files

      # It tells pre-commit:
      # "Read my .pre-commit-config.yaml and execute all configured 
      # hooks against all files in the repository."

  # ============================================================
  # 2. CHECKOV
  # ============================================================
  checkov:
    name: Checkov Terraform Security Scan
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Checkov
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade checkov

      - name: Show Checkov version
        run: |
          checkov --version

      - name: Run Checkov
        run: |
          checkov \
            -d . \
            --framework terraform \
            --config-file .checkov.yaml


  # ============================================================
  # 3. GITLEAKS
  # ============================================================
  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# gitleaks.toml
# Customizes Gitleaks detection/allowlists