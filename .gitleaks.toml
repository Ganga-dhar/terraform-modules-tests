title = "Terraform DevSecOps Gitleaks Configuration"

[extend]
useDefault = true

[[rules]]
id = "aws-access-key"
description = "AWS Access Key ID"
regex = '''AKIA[0-9A-Z]{16}'''
keywords = ["AKIA"]
tags = ["aws", "credentials"]

[[rules]]
id = "aws-secret-key"
description = "AWS Secret Access Key"
regex = '''(?i)(aws_secret_access_key|aws_secret_key)\s*[:=]\s*["']?[A-Za-z0-9/+=]{40}["']?'''
keywords = ["aws_secret_access_key", "aws_secret_key"]
tags = ["aws", "credentials"]

[[rules]]
id = "generic-api-key"
description = "Generic API Key"
regex = '''(?i)(api[_-]?key)\s*[:=]\s*["']?[A-Za-z0-9_-]{20,}["']?'''
keywords = ["api_key", "apikey"]
tags = ["api", "credentials"]

[[rules]]
id = "github-pat"
description = "GitHub Personal Access Token"
regex = '''ghp_[A-Za-z0-9]{36}'''
keywords = ["ghp_"]
tags = ["github", "token"]

[[rules]]
id = "slack-token"
description = "Slack Token"
regex = '''xox[baprs]-[A-Za-z0-9-]{10,}'''
keywords = ["xox"]
tags = ["slack", "token"]

[[rules]]
id = "private-key"
description = "Private Key"
regex = '''-----BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----'''
keywords = ["PRIVATE KEY"]
tags = ["private-key"]

[[rules]]
id = "internal-api-token"
description = "Internal API Token"
regex = '''(?i)internal[_-]?api[_-]?token\s*[:=]\s*["']?[A-Za-z0-9_-]{25,}["']?'''
keywords = ["internal_api_token", "internal-api-token"]
tags = ["internal", "token"]